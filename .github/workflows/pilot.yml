name: Matched model pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paid-model-experiments
  cancel-in-progress: false
jobs:
  evaluate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - name: Run two matched episodes ($3.60 maximum per model)
        env:
          CARDSHOPBENCH_API_KEY: ${{ secrets.CARDSHOPBENCH_API_KEY }}
        run: python scripts/pilot.py ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-model-${{ matrix.model }}
          path: runs/pilot/
          retention-days: 30
